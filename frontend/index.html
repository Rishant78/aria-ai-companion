<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('companion-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved = theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-resolved-theme', resolved);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) {
            meta.content = theme === 'system' ? 'light dark' : theme;
          }
        } catch (e) {}

        // Fallback safety net for module loading errors before React mounts
        window.addEventListener('error', function() {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0) && !window.__ARIA_MOUNTED__) {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#090d16;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;padding:24px;box-sizing:border-box;text-align:center;">' +
              '<div style="max-width:440px;background:#151c2c;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px 24px;box-shadow:0 16px 32px rgba(0,0,0,0.4);">' +
              '<div style="font-size:36px;margin-bottom:12px;">⚡</div>' +
              '<h2 style="font-size:18px;margin:0 0 8px 0;font-weight:600;">Application Update Needed</h2>' +
              '<p style="font-size:13px;color:#94a3b8;line-height:1.5;margin:0 0 20px 0;">A development module or dependency updated. Please reload the page to load the fresh assets.</p>' +
              '<button onclick="window.location.reload()" style="background:#6366f1;color:#fff;border:none;padding:10px 22px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.2s;">Reload Page</button>' +
              '</div></div>';
          }
        });
      })();
    </script>
    <title>Aria — Immersive Anime AI Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
